[project]
name = "lance-arxiv-tools"
version = "0.1.0"
description = "Optional Python embedding service for the local arXiv project"
requires-python = ">=3.10"
dependencies = [
    "lancedb>=0.40.0",
]

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=6.1,<7",
    "transformers>=5,<6",
    "compressed-tensors>=0.12",
]
indexer = [
    "pylance==13.0.0",
    "torch>=2.0",
]

[tool.uv]
package = false
