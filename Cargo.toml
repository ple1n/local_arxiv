[package]
name = "lance_arxiv"
version = "0.1.0"
edition = "2024"
default-run = "lance_arxiv"

[dependencies]
lancedb = { version = "0.40.0", features = ["remote"] }
parquet2 = "0.17.2"
parquet = { version = "58.4.0", features = ["arrow"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
futures = "0.3"
rmcp = { version = "3.5.1", features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokenizers = "0.23.2"
